<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>VibeNow Map - Test</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000, #0a0a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            color: #00d4ff;
            z-index: 2000;
            font-family: Arial, sans-serif;
        }

        .overlay.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            font-family: Arial, sans-serif;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 14px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            font-family: Arial, monospace;
            max-width: 300px;
        }

        .info-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #00d4ff;
        }

        .info-coord {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .info-accuracy {
            font-size: 10px;
            opacity: 0.6;
            color: #ff006e;
        }

        .mapboxgl-popup-content {
            background: rgba(0, 0, 0, 0.95) !important;
            color: #00d4ff !important;
            border: 1px solid #00d4ff !important;
            padding: 10px !important;
            border-radius: 6px !important;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <div>VIBENOW MAP - LOADING</div>
    </div>
    <div class="status" id="status">INITIALIZING...</div>
    <div class="info" id="info" style="display:none;">
        <div class="info-title">📍 Location</div>
        <div class="info-coord" id="infoCoord">Detecting...</div>
        <div class="info-accuracy" id="infoAccuracy"></div>
    </div>

    <script>
        console.log('✅ VibeNow Map Test - Chrome Edition');

        // CONFIG
        const CONFIG = {
            token: 'pk.eyJ1IjoiZWxhZ2FiaWEiLCJhIjoiY21oZnd4ODJsMDMzNTJrcXZ0dnVxa21kYiJ9.PBKZrjAX0iGRpo0ztAafgg'
        };

        // STATE
        let map = null;
        let userMarker = null;
        let locationAccuracy = 0;

        // ============================================================
        // INITIALIZE MAP
        // ============================================================

        function initMap() {
            console.log('🗺️ Initializing map...');

            mapboxgl.accessToken = CONFIG.token;

            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [9.19, 45.46],
                zoom: 13,
                attributionControl: false
            });

            map.on('load', () => {
                console.log('✅ Map loaded');
                document.getElementById('overlay').classList.add('hidden');
                document.getElementById('status').textContent = '🟢 LIVE';

                // Add GeoJSON source
                map.addSource('vibes', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] }
                });

                // Add layer
                map.addLayer({
                    id: 'vibes-layer',
                    type: 'circle',
                    source: 'vibes',
                    paint: {
                        'circle-radius': 8,
                        'circle-color': '#00d4ff',
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#ff006e'
                    }
                });

                // Get location
                getLocation();

                // Notify app
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({type: 'MAP_READY'}));
                }
            });

            map.on('error', (e) => console.error('❌ Error:', e));
        }

        // ============================================================
        // GET LOCATION
        // ============================================================

        function getLocation() {
            console.log('📍 Getting location...');

            // TRY BROWSER GEOLOCATION FIRST (ACCURATE)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        console.log('✅ Browser geolocation success');
                        const { latitude, longitude, accuracy } = pos.coords;
                        locationAccuracy = accuracy;
                        centerMap(latitude, longitude, 'Browser GPS', accuracy);
                    },
                    (err) => {
                        console.warn('⚠️ Browser geolocation failed:', err.message);
                        tryIPGeolocation();
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                console.warn('⚠️ Geolocation not supported');
                tryIPGeolocation();
            }
        }

        function tryIPGeolocation() {
            console.log('📍 Trying IP geolocation...');

            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(data => {
                    if (data.latitude && data.longitude) {
                        console.log('✅ IP geolocation success');
                        centerMap(parseFloat(data.latitude), parseFloat(data.longitude), data.city || 'IP Location', 5000);
                    }
                })
                .catch(e => console.error('❌ IP failed:', e));
        }

        // ============================================================
        // CENTER MAP
        // ============================================================

        function centerMap(lat, lng, name, accuracy) {
            console.log('🎯 Center:', lat, lng, name);

            // Fly to location
            map.flyTo({
                center: [lng, lat],
                zoom: 15,
                duration: 1500
            });

            // Add marker - VERY SMALL (16px)
            setTimeout(() => {
                addUserMarker(lat, lng, accuracy);
            }, 300);

            // Update UI
            document.getElementById('infoCoord').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            if (accuracy) {
                document.getElementById('infoAccuracy').textContent = `Accuracy: ±${Math.round(accuracy)}m`;
            }
            document.getElementById('info').style.display = 'block';
        }

        // ============================================================
        // ADD USER MARKER - TINY SIZE
        // ============================================================

        function addUserMarker(lat, lng, accuracy) {
            if (userMarker) userMarker.remove();

            // CREATE TINY MARKER (16px)
            const el = document.createElement('div');
            el.style.width = '16px';
            el.style.height = '16px';
            el.style.background = 'radial-gradient(circle, #00d4ff 0%, rgba(0, 212, 255, 0.4) 100%)';
            el.style.border = '2px solid #ff006e';
            el.style.borderRadius = '50%';
            el.style.boxShadow = '0 0 12px rgba(0, 212, 255, 0.8)';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';

            // Inner dot
            const dot = document.createElement('div');
            dot.style.width = '4px';
            dot.style.height = '4px';
            dot.style.background = '#fff';
            dot.style.borderRadius = '50%';
            el.appendChild(dot);

            userMarker = new mapboxgl.Marker(el, { anchor: 'center' })
                .setLngLat([lng, lat])
                .setPopup(new mapboxgl.Popup({ offset: 15 }).setHTML(`
                    <div>
                        <strong>📍 Your Position</strong><br/>
                        <small>${lat.toFixed(6)}</small><br/>
                        <small>${lng.toFixed(6)}</small><br/>
                        ${accuracy ? '<small style="color: #ff006e;">±' + Math.round(accuracy) + 'm</small>' : ''}
                    </div>
                `))
                .addTo(map);

            console.log('✅ Tiny marker added (16px)');
        }

        // ============================================================
        // MESSAGE LISTENER (for app integration)
        // ============================================================

        window.addEventListener('message', (e) => {
            try {
                const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                console.log('📨 Message:', data.type);

                if (data.type === 'SET_CENTER') {
                    centerMap(data.lat, data.lng, data.name || 'App Location', null);
                }
                else if (data.type === 'ADD_VIBE') {
                    const vibe = data.vibe;
                    const source = map.getSource('vibes');
                    if (source) {
                        const geoData = source._data;
                        geoData.features.push({
                            type: 'Feature',
                            geometry: { type: 'Point', coordinates: [vibe.longitude, vibe.latitude] },
                            properties: { title: vibe.title, user: vibe.userName }
                        });
                        source.setData(geoData);
                    }
                    map.flyTo({ center: [vibe.longitude, vibe.latitude], zoom: 16 });
                }
            } catch (err) {
                console.error('❌ Error:', err);
            }
        });

        // ============================================================
        // START
        // ============================================================

        console.log('🚀 Starting...');
        initMap();
    </script>
</body>
</html>
