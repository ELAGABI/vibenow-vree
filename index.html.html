<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>VibeNow Map</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* ====================== ANIMATIONS ====================== */

        @keyframes pulse {
            0% {
                r: 8;
                opacity: 1;
            }

            100% {
                r: 25;
                opacity: 0;
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.3) rotate(10deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes glow {
            0%,
            100% {
                filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.8));
            }

            50% {
                filter: drop-shadow(0 0 16px rgba(0, 212, 255, 1));
            }
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* ====================== MAPBOX POPUP STYLE ====================== */

        .mapboxgl-popup-content {
            background: rgba(26, 26, 46, 0.95) !important;
            color: #00d4ff !important;
            padding: 12px !important;
            border-radius: 8px !important;
            border: 1px solid #00d4ff !important;
            font-size: 12px;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        .mapboxgl-popup-tip {
            border-top-color: #00d4ff !important;
        }

        .mapboxgl-popup-anchor-top .mapboxgl-popup-tip {
            border-bottom-color: #00d4ff !important;
            border-top-color: transparent !important;
        }

        /* ====================== LOADING INDICATOR ====================== */

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00d4ff;
            font-size: 14px;
            z-index: 10;
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id='map'></div>
    <div class="loading-indicator" id="loadingIndicator">📍 Caricamento mappa...</div>

    <script>
        /* ============================================================
           VIBENOW MAP - COMPLETE INTERACTIVE WEBVIEW
           Features: Real-time vibes, user location, smooth animations
           ============================================================ */

        // ============================================================
        // 🔧 CONFIGURATION
        // ============================================================

        mapboxgl.accessToken = 'pk.eyJ1IjoiZWxhZ2FiaWEiLCJhIjoiY21oZnd4ODJsMDMzNTJrcXZ0dnVxa21kYiJ9.PBKZrjAX0iGRpo0ztAafgg';

        let userLat = 45.46; // Default Milano
        let userLng = 9.19;
        let mapLoaded = false;
        let userMarkerAdded = false;
        let userLocationMarker = null;

        // ============================================================
        // 🗺️ INITIALIZE MAPBOX
        // ============================================================

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [userLng, userLat],
            zoom: 13,
            pitch: 0,
            bearing: 0,
            antialias: true,
            renderWorldCopies: false
        });

        // ============================================================
        // 📍 SETUP MAP ON LOAD
        // ============================================================

        map.on('load', () => {
            console.log('✅ Mapbox loaded successfully');
            mapLoaded = true;

            // Hide loading indicator
            const indicator = document.getElementById('loadingIndicator');
            if (indicator) {
                indicator.classList.add('hidden');
            }

            // Create custom marker image
            createMarkerImage();

            // Add GeoJSON source for vibes
            map.addSource('vibes-source', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: []
                }
            });

            // Add symbol layer for vibe markers
            map.addLayer({
                id: 'vibes-layer',
                type: 'symbol',
                source: 'vibes-source',
                layout: {
                    'icon-image': 'vibe-marker',
                    'icon-size': 1.8,
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true
                }
            });

            // Add pulsing circle layer
            map.addLayer({
                id: 'pulse-layer',
                type: 'circle',
                source: 'vibes-source',
                paint: {
                    'circle-radius': 12,
                    'circle-color': '#00d4ff',
                    'circle-opacity': 0.3,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ff006e',
                    'circle-stroke-opacity': 0.6
                }
            });

            // Add click handler for markers
            setupMarkerClickHandler();

            // Change cursor on hover
            map.on('mouseenter', 'vibes-layer', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'vibes-layer', () => {
                map.getCanvas().style.cursor = '';
            });

            // Notify app that map is ready
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'MAP_READY',
                    status: 'Map initialized and ready'
                }));
            }

            console.log('✅ Map fully initialized with layers');
        });

        // ============================================================
        // 🎨 CREATE CUSTOM MARKER IMAGE
        // ============================================================

        function createMarkerImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 48;
            const ctx = canvas.getContext('2d');

            // Outer glow
            ctx.fillStyle = 'rgba(0, 212, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(24, 24, 20, 0, Math.PI * 2);
            ctx.fill();

            // Middle circle
            ctx.fillStyle = 'rgba(0, 212, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(24, 24, 14, 0, Math.PI * 2);
            ctx.fill();

            // Inner marker
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(24, 24, 8, 0, Math.PI * 2);
            ctx.fill();

            // Border
            ctx.strokeStyle = '#ff006e';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inner dot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(24, 24, 3, 0, Math.PI * 2);
            ctx.fill();

            map.addImage('vibe-marker', canvas, { sdf: false });
            console.log('✅ Marker image created');
        }

        // ============================================================
        // 📥 MESSAGE LISTENER FROM REACT NATIVE
        // ============================================================

        window.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === 'string'
                    ? JSON.parse(event.data)
                    : event.data;

                console.log('📨 Message:', data.type, data);

                if (!data.type) return;

                switch (data.type) {
                    case 'SET_CENTER':
                        handleSetCenter(data);
                        break;

                    case 'ADD_VIBE':
                        handleAddVibe(data);
                        break;

                    case 'UPDATE_VIBES':
                        handleUpdateVibes(data);
                        break;

                    case 'FLY_TO':
                        handleFlyTo(data);
                        break;

                    case 'CLEAR_VIBES':
                        handleClearVibes();
                        break;

                    case 'REMOVE_VIBE':
                        handleRemoveVibe(data);
                        break;

                    default:
                        console.warn('⚠️ Unknown message type:', data.type);
                }
            } catch (error) {
                console.error('❌ Message error:', error);
            }
        });

        // ============================================================
        // 🎯 HANDLE SET_CENTER - Center map on user location
        // ============================================================

        function handleSetCenter(data) {
            console.log('🎯 SET_CENTER:', data.lat, data.lng);

            if (!data.lat || !data.lng) {
                console.warn('❌ Invalid coordinates');
                return;
            }

            userLat = parseFloat(data.lat);
            userLng = parseFloat(data.lng);

            console.log('📍 New center:', [userLng, userLat]);

            // 1. Immediate center change
            map.easeTo({
                center: [userLng, userLat],
                zoom: 15,
                duration: 500,
                essential: false
            });

            // 2. Add user marker after delay
            setTimeout(() => {
                addUserLocationMarker(userLat, userLng);
            }, 300);

            // 3. Smooth fly animation
            setTimeout(() => {
                console.log('🎬 Fly animation');
                map.flyTo({
                    center: [userLng, userLat],
                    zoom: 15,
                    bearing: 0,
                    pitch: 0,
                    duration: 1200,
                    essential: false
                });
            }, 800);
        }

        // ============================================================
        // ➕ ADD SINGLE VIBE MARKER
        // ============================================================

        function handleAddVibe(data) {
            if (!data.vibe) {
                console.warn('❌ No vibe data');
                return;
            }

            const vibe = data.vibe;

            console.log('➕ Adding vibe:', vibe.id);

            if (!vibe.latitude || !vibe.longitude) {
                console.warn('❌ Invalid vibe coordinates');
                return;
            }

            const source = map.getSource('vibes-source');
            if (!source) {
                console.error('❌ Vibes source not found');
                return;
            }

            const sourceData = source._data;

            // Check if already exists
            if (sourceData.features.some(f => f.properties.id === vibe.id)) {
                console.log('ℹ️ Vibe already exists');
                return;
            }

            // Create feature
            const feature = {
                type: 'Feature',
                geometry: {
                    type: 'Point',
                    coordinates: [parseFloat(vibe.longitude), parseFloat(vibe.latitude)]
                },
                properties: {
                    id: vibe.id,
                    title: vibe.title || 'Vibe',
                    user: vibe.userName || 'Utente',
                    category: vibe.category || 'General'
                }
            };

            sourceData.features.push(feature);
            source.setData(sourceData);

            console.log('✅ Vibe added');

            // Smooth fly to new vibe
            map.flyTo({
                center: [parseFloat(vibe.longitude), parseFloat(vibe.latitude)],
                zoom: Math.min(map.getZoom() + 0.8, 16),
                duration: 1200,
                essential: false
            });
        }

        // ============================================================
        // 🔄 BATCH UPDATE ALL VIBES
        // ============================================================

        function handleUpdateVibes(data) {
            if (!data.vibes || !Array.isArray(data.vibes)) {
                console.warn('❌ Invalid vibes array');
                return;
            }

            console.log('🔄 Updating vibes:', data.vibes.length);

            const features = data.vibes
                .filter(v => v.latitude && v.longitude)
                .map(v => ({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [parseFloat(v.longitude), parseFloat(v.latitude)]
                    },
                    properties: {
                        id: v.id,
                        title: v.title || 'Vibe',
                        user: v.userName || 'Utente',
                        category: v.category || 'General'
                    }
                }));

            const source = map.getSource('vibes-source');
            if (source) {
                source.setData({
                    type: 'FeatureCollection',
                    features: features
                });
                console.log('✅ Vibes updated');
            }
        }

        // ============================================================
        // ✈️ FLY TO LOCATION
        // ============================================================

        function handleFlyTo(data) {
            if (!data.lat || !data.lng) {
                console.warn('❌ Invalid fly-to coordinates');
                return;
            }

            const lat = parseFloat(data.lat);
            const lng = parseFloat(data.lng);
            const zoom = data.zoom || 15;

            console.log('✈️ Flying to:', lat, lng);

            map.flyTo({
                center: [lng, lat],
                zoom: zoom,
                bearing: 0,
                pitch: 0,
                duration: 2000,
                essential: true
            });
        }

        // ============================================================
        // 🗑️ CLEAR ALL VIBES
        // ============================================================

        function handleClearVibes() {
            console.log('🗑️ Clearing vibes');

            const source = map.getSource('vibes-source');
            if (source) {
                source.setData({
                    type: 'FeatureCollection',
                    features: []
                });
                console.log('✅ Vibes cleared');
            }
        }

        // ============================================================
        // ❌ REMOVE SINGLE VIBE
        // ============================================================

        function handleRemoveVibe(data) {
            if (!data.vibeId) {
                console.warn('❌ No vibe ID');
                return;
            }

            console.log('❌ Removing vibe:', data.vibeId);

            const source = map.getSource('vibes-source');
            if (source) {
                const sourceData = source._data;
                sourceData.features = sourceData.features.filter(
                    f => f.properties.id !== data.vibeId
                );
                source.setData(sourceData);
                console.log('✅ Vibe removed');
            }
        }

        // ============================================================
        // 📍 ADD USER LOCATION MARKER
        // ============================================================

        function addUserLocationMarker(lat, lng) {
            // Remove existing marker
            if (userLocationMarker) {
                userLocationMarker.remove();
            }

            const markerElement = document.createElement('div');
            markerElement.style.cssText = `
                width: 32px;
                height: 32px;
                background: radial-gradient(circle, #00d4ff 0%, rgba(0, 212, 255, 0.5) 100%);
                border: 3px solid #ff006e;
                border-radius: 50%;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                animation: glow 2s ease-in-out infinite;
            `;

            const innerDot = document.createElement('div');
            innerDot.style.cssText = `
                width: 8px;
                height: 8px;
                background: #ffffff;
                border-radius: 50%;
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            `;
            markerElement.appendChild(innerDot);

            userLocationMarker = new mapboxgl.Marker(markerElement, {
                anchor: 'center'
            })
                .setLngLat([lng, lat])
                .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(
                    `<div style="text-align: center;">
                        <strong>📍 La tua posizione</strong><br/>
                        <small>${lat.toFixed(4)}, ${lng.toFixed(4)}</small>
                    </div>`
                ))
                .addTo(map);

            userMarkerAdded = true;
            console.log('✅ User marker added');
        }

        // ============================================================
        // 🎯 MARKER CLICK HANDLER
        // ============================================================

        let popupCache = null;

        function setupMarkerClickHandler() {
            map.on('click', 'vibes-layer', (e) => {
                if (!e.features || e.features.length === 0) return;

                const feature = e.features[0];
                const props = feature.properties;
                const coords = feature.geometry.coordinates;

                console.log('👆 Marker clicked:', props.id);

                // Close existing popup
                if (popupCache) {
                    popupCache.remove();
                }

                // Create popup
                const popupContent = `
                    <div style="animation: fadeIn 0.3s ease-in;">
                        <div style="margin-bottom: 8px;">
                            <strong style="font-size: 14px; color: #00d4ff;">
                                ${props.title}
                            </strong>
                        </div>
                        <div style="font-size: 11px; color: #00d4ff; opacity: 0.8; margin-bottom: 6px;">
                            <strong>👤 ${props.user}</strong>
                        </div>
                        <div style="font-size: 11px; color: #00d4ff; opacity: 0.8; margin-bottom: 6px;">
                            <strong>📂 ${props.category}</strong>
                        </div>
                        <div style="font-size: 10px; color: #00d4ff; opacity: 0.6;">
                            📍 ${coords[1].toFixed(4)}, ${coords[0].toFixed(4)}
                        </div>
                    </div>
                `;

                popupCache = new mapboxgl.Popup({
                    closeButton: true,
                    closeOnClick: true,
                    offset: 25,
                    maxWidth: '220px'
                })
                    .setLngLat(coords)
                    .setHTML(popupContent)
                    .addTo(map);

                // Notify app
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'VIBE_CLICKED',
                        vibe: {
                            id: props.id,
                            title: props.title,
                            user: props.user,
                            category: props.category,
                            coordinates: coords
                        }
                    }));
                }
            });
        }

        // ============================================================
        // 🛡️ ERROR HANDLING
        // ============================================================

        map.on('error', (e) => {
            console.error('❌ Map error:', e);
        });

        // ============================================================
        // 📊 INITIAL LOG
        // ============================================================

        console.log('🗺️ VibeNow Map Script Loaded');
        console.log('📍 Default center:', [userLng, userLat]);
        console.log('🔑 Mapbox token configured');
    </script>
</body>

</html>
