<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>VibeNow Map</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; }
        #map { width: 100%; height: 100vh; }
        
        /* 🎨 PULSING DOT ANIMATION */
        @keyframes pulse {
            0% { r: 6; opacity: 1; }
            100% { r: 20; opacity: 0; }
        }
        .pulse-circle {
            animation: pulse 2s infinite;
        }
        
        /* 🎨 POP-IN ANIMATION per nuovi marker */
        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .marker-pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        /* 🎨 GLOW EFFECT */
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.8)); }
            50% { filter: drop-shadow(0 0 12px rgba(0, 212, 255, 1)); }
        }
        .marker-glow { animation: glow 1.5s ease-in-out infinite; }
        
        .mapboxgl-popup-content {
            background: #1a1a2e !important;
            color: #00d4ff !important;
            padding: 12px !important;
            border-radius: 8px !important;
            border: 1px solid #00d4ff !important;
            font-size: 12px;
        }
        .mapboxgl-popup-tip { border-top-color: #00d4ff !important; }
    </style>
</head>
<body>
    <div id='map'></div>
    
    <script>
        // 🔑 YOUR MAPBOX TOKEN (sostituisci con il tuo)
        mapboxgl.accessToken = 'pk.eyJ1IjoiZWxhZ2FiaWEiLCJhIjoiY21oZnd4ODJsMDMzNTJrcXZ0dnVxa21kYiJ9.PBKZrjAX0iGRpo0ztAafgg';
        
        // 🗺️ INITIALIZE MAP
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [9.19, 45.46], // Milano default
            zoom: 13,
            pitch: 0,
            bearing: 0
        });
        
        // 🎨 Aggiungi immagine animata per pulsing dot
        map.on('load', () => {
            // Crea immagine del marker
            const canvas = document.createElement('canvas');
            canvas.width = 40;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');
            
            // Disegna marker neon cyan
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(20, 15, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ff006e';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            map.addImage('vibe-marker', canvas, { sdf: false });
            
            // 📍 GEOJSON SOURCE per i vibes
            map.addSource('vibes-source', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: []
                }
            });
            
            // 🎯 LAYER con marker
            map.addLayer({
                id: 'vibes-layer',
                type: 'symbol',
                source: 'vibes-source',
                layout: {
                    'icon-image': 'vibe-marker',
                    'icon-size': 1.5,
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true
                }
            });
            
            // ✨ Pulsing circle layer (background)
            map.addLayer({
                id: 'pulse-layer',
                type: 'circle',
                source: 'vibes-source',
                paint: {
                    'circle-radius': 10,
                    'circle-color': '#00d4ff',
                    'circle-opacity': 0.3,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ff006e'
                }
            });
        });
        
        // 📥 RICEVI MESSAGGI DAL APP
        window.addEventListener('message', (event) => {
            const data = event.data;
            
            if (data.type === 'ADD_VIBE') {
                addVibeMarker(data.vibe);
            } else if (data.type === 'UPDATE_VIBES') {
                updateAllVibes(data.vibes);
            } else if (data.type === 'FLY_TO') {
                flyToLocation(data.lat, data.lng);
            }
        });
        
        // ➕ AGGIUNGI VIBE MARKER CON ANIMAZIONE
        function addVibeMarker(vibe) {
            const source = map.getSource('vibes-source');
            if (!source) return;
            
            const data = source._data;
            
            // Verifica se esiste gia'
            const exists = data.features.some(f => f.properties.id === vibe.id);
            if (exists) return;
            
            const newFeature = {
                type: 'Feature',
                geometry: {
                    type: 'Point',
                    coordinates: [vibe.longitude, vibe.latitude]
                },
                properties: {
                    id: vibe.id,
                    title: vibe.title || 'Vibe',
                    user: vibe.userName || 'Utente',
                    category: vibe.category || 'General'
                }
            };
            
            data.features.push(newFeature);
            source.setData(data);
            
            // 🎬 SMOOTH ANIMATION: Zoom-in verso il nuovo marker
            map.easeTo({
                center: [vibe.longitude, vibe.latitude],
                zoom: map.getZoom() + 0.5,
                duration: 1000,
                easing: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t
            });
            
            // 🎯 POPUP al tap
            map.on('click', 'vibes-layer', (e) => {
                const props = e.features[0].properties;
                const popup = new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <div style="padding: 8px;">
                            <strong>${props.title}</strong><br/>
                            <small>${props.user}</small><br/>
                            <small>📍 ${props.category}</small>
                        </div>
                    `)
                    .addTo(map);
            });
        }
        
        // 🔄 AGGIORNA TUTTI I VIBES (per la sincronizzazione iniziale)
        function updateAllVibes(vibes) {
            const geojson = {
                type: 'FeatureCollection',
                features: vibes.map(v => ({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [v.longitude, v.latitude]
                    },
                    properties: {
                        id: v.id,
                        title: v.title || 'Vibe',
                        user: v.userName || 'Utente',
                        category: v.category || 'General'
                    }
                }))
            };
            
            const source = map.getSource('vibes-source');
            if (source) {
                source.setData(geojson);
            }
        }
        
        // ✈️ SMOOTH FLY-TO per una posizione
        function flyToLocation(lat, lng) {
            map.flyTo({
                center: [lng, lat],
                zoom: 15,
                bearing: 0,
                pitch: 0,
                duration: 2000,
                essential: true
            });
        }
        
        // ✋ CURSOR FEEDBACK
        map.on('mouseenter', 'vibes-layer', () => {
            map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'vibes-layer', () => {
            map.getCanvas().style.cursor = '';
        });
    </script>
</body>
</html>
