<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>VibeNow Map</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* LOADING OVERLAY */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000, #0a0a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            color: #00d4ff;
            z-index: 2000;
            font-family: Arial, sans-serif;
        }

        .overlay.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* NO INFO BOX - CLEAN MAP */

        /* MAPBOX POPUP */
        .mapboxgl-popup-content {
            background: rgba(0, 0, 0, 0.95) !important;
            color: #00d4ff !important;
            border: 1px solid #00d4ff !important;
            padding: 10px !important;
            border-radius: 6px !important;
            font-family: Arial, sans-serif;
        }

        .mapboxgl-popup-tip {
            border-top-color: #00d4ff !important;
        }

        .mapboxgl-popup-close-button {
            color: #00d4ff !important;
            font-size: 18px !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <div>VIBENOW</div>
    </div>

    <script>
        console.log('✅ VibeNow Map - Clean Edition');

        // CONFIG
        const CONFIG = {
            token: 'pk.eyJ1IjoiZWxhZ2FiaWEiLCJhIjoiY21oZnd4ODJsMDMzNTJrcXZ0dnVxa21kYiJ9.PBKZrjAX0iGRpo0ztAafgg'
        };

        // STATE
        let map = null;
        let userMarker = null;

        // ============================================================
        // INITIALIZE MAP
        // ============================================================

        function initMap() {
            console.log('🗺️ Init');

            mapboxgl.accessToken = CONFIG.token;

            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [9.19, 45.46],
                zoom: 13,
                attributionControl: false
            });

            map.on('load', () => {
                console.log('✅ Loaded');
                document.getElementById('overlay').classList.add('hidden');

                // Add source
                map.addSource('vibes', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] }
                });

                // Add layer
                map.addLayer({
                    id: 'vibes-layer',
                    type: 'circle',
                    source: 'vibes',
                    paint: {
                        'circle-radius': 8,
                        'circle-color': '#00d4ff',
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#ff006e'
                    }
                });

                // Click handler
                map.on('click', 'vibes-layer', (e) => {
                    if (!e.features || !e.features[0]) return;
                    const props = e.features[0].properties;
                    const coords = e.features[0].geometry.coordinates;

                    new mapboxgl.Popup({ offset: 25 })
                        .setLngLat(coords)
                        .setHTML(`
                            <div>
                                <strong>${props.title || 'Vibe'}</strong><br/>
                                <small>👤 ${props.user || 'User'}</small><br/>
                                <small>📂 ${props.category || 'General'}</small>
                            </div>
                        `)
                        .addTo(map);
                });

                // Get location
                getLocation();

                // Notify app
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({type: 'MAP_READY'}));
                }
            });
        }

        // ============================================================
        // GET LOCATION
        // ============================================================

        function getLocation() {
            console.log('📍 Getting location');

            // Browser geolocation (accurate)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        console.log('✅ GPS:', pos.coords.latitude, pos.coords.longitude);
                        centerMap(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => {
                        console.warn('⚠️ GPS failed, trying IP');
                        tryIP();
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                tryIP();
            }
        }

        function tryIP() {
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(data => {
                    if (data.latitude && data.longitude) {
                        console.log('✅ IP:', data.city);
                        centerMap(parseFloat(data.latitude), parseFloat(data.longitude));
                    }
                })
                .catch(e => console.warn('⚠️ IP failed'));
        }

        // ============================================================
        // CENTER MAP
        // ============================================================

        function centerMap(lat, lng) {
            console.log('🎯', lat, lng);

            map.flyTo({
                center: [lng, lat],
                zoom: 15,
                duration: 1500
            });

            setTimeout(() => {
                addMarker(lat, lng);
            }, 300);
        }

        // ============================================================
        // ADD TINY MARKER (16px)
        // ============================================================

        function addMarker(lat, lng) {
            if (userMarker) userMarker.remove();

            const el = document.createElement('div');
            el.style.width = '16px';
            el.style.height = '16px';
            el.style.background = 'radial-gradient(circle, #00d4ff, rgba(0, 212, 255, 0.4))';
            el.style.border = '2px solid #ff006e';
            el.style.borderRadius = '50%';
            el.style.boxShadow = '0 0 12px rgba(0, 212, 255, 0.8)';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';

            const dot = document.createElement('div');
            dot.style.width = '4px';
            dot.style.height = '4px';
            dot.style.background = '#fff';
            dot.style.borderRadius = '50%';
            el.appendChild(dot);

            userMarker = new mapboxgl.Marker(el, { anchor: 'center' })
                .setLngLat([lng, lat])
                .setPopup(new mapboxgl.Popup({ offset: 15 }).setHTML(`
                    <div style="text-align: center;">
                        <strong>📍 You</strong><br/>
                        <small>${lat.toFixed(6)}, ${lng.toFixed(6)}</small>
                    </div>
                `))
                .addTo(map);

            console.log('✅ Marker');
        }

        // ============================================================
        // MESSAGE LISTENER
        // ============================================================

        window.addEventListener('message', (e) => {
            try {
                const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                console.log('📨', data.type);

                if (data.type === 'SET_CENTER') {
                    centerMap(data.lat, data.lng);
                }
                else if (data.type === 'ADD_VIBE') {
                    const v = data.vibe;
                    const source = map.getSource('vibes');
                    if (source) {
                        const geoData = source._data;
                        geoData.features.push({
                            type: 'Feature',
                            geometry: { type: 'Point', coordinates: [v.longitude, v.latitude] },
                            properties: { id: v.id, title: v.title, user: v.userName, category: v.category }
                        });
                        source.setData(geoData);
                        map.flyTo({ center: [v.longitude, v.latitude], zoom: 16 });
                    }
                }
                else if (data.type === 'UPDATE_VIBES') {
                    const source = map.getSource('vibes');
                    if (source && data.vibes) {
                        const features = data.vibes.map(v => ({
                            type: 'Feature',
                            geometry: { type: 'Point', coordinates: [v.longitude, v.latitude] },
                            properties: { id: v.id, title: v.title, user: v.userName, category: v.category }
                        }));
                        source.setData({ type: 'FeatureCollection', features });
                    }
                }
            } catch (err) {
                console.error('❌', err);
            }
        });

        // ============================================================
        // START
        // ============================================================

        initMap();
    </script>
</body>
</html>
